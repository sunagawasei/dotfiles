prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Platform Team
      filters: is:open team-review-requested:cycloud-io/cycloud-platform-developers
    - title: DevEx Team
      filters: is:open team-review-requested:cycloud-io/devex-section
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.6
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings: {}
repoPaths:
    cycloud-io/*: ~/work/*
    ca-studio-apps/*: ~/work/*
    CyberAgent-Infosys/*: ~/work/*
    ca-data-pf/*: ~/work/*
    caad-develop/*: ~/work/*
    ca-ciu/*: ~/work/*
    PERMAN/*: ~/work/*
    sunagawasei/*: ~/poc/*
    # cloneのディレクトリ名がrepo名と違う2件はワイルドカードで解決できない
    cycloud-io/openstack-core-usage-report: ~/work/openstack-core-collector
    CyberAgent-Infosys/caad-valuedomain-tool: ~/work/value_domain_management
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: true
pager:
    # `hunk pager`はpager modeを強制し、記号キー(? , . [ ])を握り潰す。明示ファイル指定なら
    # pager modeにならないので、ghのpipeを/dev/stdinとして渡す。
    diff: hunk patch /dev/stdin
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
