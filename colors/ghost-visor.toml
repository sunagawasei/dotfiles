# Ghost Visor Color Palette
# ============================================
# Derived from wallpaper measurement (Ghost in the Shell, night skyline frame)
# 地平線帯(y570-710)の紫とマゼンタを地に据えた配色。
# Anchors: horizon #0F172B/#253153/#453C5F/#4C4C74/#615D8E/#9076A8,
#   magenta glow #945F93/#9C5B9E/#CD73C9, sky #08102D/#172245,
#   city #111A2F/#23304C/#364969, fog #718EB0/#94B0D0, glow #9AC1DE/#CEC6D3
#
# 紫が乗るのは背景・パネル・選択・境界・タブ・見出し・キーワード・git変更・マゼンタ系。
# 本文・定数・構文の識別レイヤ(function / string / type / operator / number /
# builtin_variable)は壁紙の低彩度色へ寄せない。寄せると protanopia・deuteranopia で
# 色相分離が失われる。
#
# heading / info / builtin_variable は別々の値を持つ。info を紫に寄せると
# warning と tritanopia で収束し、info を builtin_variable と同値にすると
# success との分離が基準を割る。
#
# wezterm.inactive_tab は core.panel_bg と別の値を持つ。core.panel_bg を使うと
# active_tab とのコントラスト比が 1.61 に留まる。別値にして 1.81。
#
# 値の由来は3種類ある。
#   1. 実測: 上記アンカーそのもの、またはそれに最も近い調整値
#   2. 合成: 壁紙に対応色が無い役(緑・黄・予備の一部)を、実測色から導いた値
#   3. 据置: CVD識別性(Machado 2009 / CIE76)を落とさないために保つトークン
# 予備トークン(役割未割当)も 1 か 2 のいずれかで壁紙由来にする。
#
# 数値の検証は scripts/cmd/verify-cvd-pairs と scripts/cmd/verify-colors が持つ。
#
