# Generated by: cd scripts && go run ./cmd/publish-codex-settings
approval_policy = 'on-request'
approvals_reviewer = 'auto_review'
model = 'gpt-6.1-sol'
model_reasoning_effort = 'high'
personality = 'pragmatic'
project_doc_fallback_filenames = ['CLAUDE.md']
sandbox_mode = 'workspace-write'
service_tier = 'default'
web_search = 'live'

[features]
js_repl = false
terminal_resize_reflow = true

[history]
persistence = 'save-all'

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
exclude = ['*KEY*', '*SECRET*', '*TOKEN*', '*PASSWORD*', '*CREDENTIAL*', '*PRIVATE*', '*AUTH*']
inherit = 'core'

[tui]
notifications = ['agent-turn-complete', 'approval-requested']
status_line = ['model-with-reasoning', 'current-dir', 'model', 'reasoning', 'project-name', 'git-branch', 'pull-request-number', 'branch-changes', 'run-state', 'context-used', 'five-hour-limit', 'weekly-limit', 'used-tokens', 'total-input-tokens', 'total-output-tokens']
status_line_use_colors = true
vim_mode_default = true

[tui.keymap]
[tui.keymap.chat]
edit_queued_message = ['alt-q', 'shift-left', 'alt-up']
next_permission_mode = 'ctrl-alt-p'

[tui.keymap.composer]
history_search_previous = 'ctrl-r'
submit = 'enter'

[tui.keymap.editor]
insert_newline = ['ctrl-j', 'shift-enter', 'alt-enter']

[tui.keymap.global]
copy = []
open_external_editor = ['ctrl-x ctrl-e', 'ctrl-g']
open_transcript = 'ctrl-o'
toggle_fast_mode = 'alt-o'

[tui.keymap.list]
accept = 'enter'
cancel = 'esc'
jump_bottom = 'end'
jump_top = 'home'
move_down = ['down', 'j', 'ctrl-n']
move_left = 'left'
move_right = 'right'
move_up = ['up', 'k', 'ctrl-p']
page_down = 'page-down'
page_up = 'page-up'

[tui.keymap.pager]
close = 'q'
close_transcript = 'ctrl-o'
half_page_up = 'ctrl-u'
jump_bottom = ['end', 'ctrl-end', 'shift-g', 'alt-shift-g']
jump_top = ['home', 'ctrl-home', 'g', 'alt-g']
page_down = ['page-down', 'ctrl-f', 'space', 'alt-d']
page_up = ['page-up', 'ctrl-b', 'b', 'alt-u']
scroll_down = ['down', 'j', 'ctrl-n', 'alt-j']
scroll_up = ['up', 'k', 'ctrl-p', 'alt-k']

[tui.keymap.vim_normal]
undo = ['u', 'ctrl-minus', 'ctrl-shift-minus', 'ctrl-_', 'ctrl-shift-_']
